<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Mentor - Face to Face</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                "Noto Sans Devanagari",
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #182b72,
                    #080b1c 65%
                );

            color: white;
        }


        .main {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;
        }


        .mentor-box {

            width: 1100px;

            max-width: 100%;

            min-height: 650px;

            display: grid;

            grid-template-columns:
                40% 60%;

            background:
                rgba(
                    8,
                    12,
                    35,
                    0.92
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            border-radius: 25px;

            overflow: hidden;

            box-shadow:
                0 25px 80px
                rgba(
                    0,
                    0,
                    0,
                    0.55
                );
        }


        /* =========================
           AVATAR
        ========================= */

        .avatar-area {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 35px;

            background:
                radial-gradient(
                    circle,
                    #253d9b,
                    #111735
                );
        }


        .avatar-title {

            font-size: 25px;

            font-weight: bold;

            margin-bottom: 25px;

            text-align: center;
        }


        .status {

            margin-top: 20px;

            color: #cfd7ff;

            text-align: center;

            font-size: 15px;
        }


        /* =========================
           CHARACTER
        ========================= */

        .character {

            width: 260px;

            height: 360px;

            position: relative;

            transition:
                transform 0.3s ease;
        }


        .head {

            position: absolute;

            width: 190px;

            height: 205px;

            left: 35px;

            top: 20px;

            background: #ffd0c5;

            border-radius:
                45% 45% 48% 48%;

            z-index: 3;

            box-shadow:
                0 10px 30px
                rgba(
                    0,
                    0,
                    0,
                    0.2
                );
        }


        .hair {

            position: absolute;

            width: 205px;

            height: 220px;

            left: 28px;

            top: 5px;

            background: #241b27;

            border-radius:
                48% 48% 35% 35%;

            z-index: 2;
        }


        .hair::after {

            content: "";

            position: absolute;

            width: 35px;

            height: 145px;

            right: -4px;

            top: 55px;

            background: #241b27;

            border-radius: 50%;
        }


        .eye {

            position: absolute;

            width: 25px;

            height: 25px;

            top: 85px;

            background: white;

            border-radius: 50%;

            z-index: 5;

            transition:
                transform 0.12s ease;
        }


        .eye::after {

            content: "";

            position: absolute;

            width: 9px;

            height: 9px;

            left: 8px;

            top: 8px;

            background: #222;

            border-radius: 50%;
        }


        .eye.left {

            left: 82px;
        }


        .eye.right {

            right: 35px;
        }


        .brow {

            position: absolute;

            width: 40px;

            height: 6px;

            top: 72px;

            background: #332027;

            border-radius: 10px;

            z-index: 6;
        }


        .brow.left {

            left: 72px;

            transform:
                rotate(-5deg);
        }


        .brow.right {

            right: 30px;

            transform:
                rotate(5deg);
        }


        .nose {

            position: absolute;

            left: 123px;

            top: 105px;

            width: 5px;

            height: 50px;

            background: #e5a69b;

            border-radius: 10px;

            z-index: 5;
        }


        .mouth {

            position: absolute;

            left: 93px;

            top: 165px;

            width: 65px;

            height: 18px;

            border-bottom:
                4px solid #a54e62;

            border-radius:
                0 0 50% 50%;

            z-index: 6;

            transition:
                all 0.2s ease;
        }


        .neck {

            position: absolute;

            width: 70px;

            height: 75px;

            left: 95px;

            top: 190px;

            background: #ffd0c5;

            z-index: 1;
        }


        .body {

            position: absolute;

            width: 220px;

            height: 145px;

            left: 20px;

            top: 230px;

            background:
                linear-gradient(
                    135deg,
                    #374bd0,
                    #1b277d
                );

            border-radius:
                80px 80px 20px 20px;

            z-index: 1;
        }


        /* =========================
           EXPRESSIONS
        ========================= */

        .character.listening {

            transform:
                scale(1.02);
        }


        .character.thinking
        .brow.left {

            transform:
                rotate(-15deg);
        }


        .character.thinking
        .brow.right {

            transform:
                rotate(15deg);
        }


        .character.happy
        .mouth {

            height: 30px;

            border-bottom-width: 5px;
        }


        .character.surprised
        .mouth {

            width: 28px;

            height: 32px;

            left: 112px;

            border:
                4px solid #a54e62;

            border-radius: 50%;
        }


        .character.talking
        .mouth {

            animation:
                talk
                0.22s
                infinite
                alternate;
        }


        @keyframes talk {

            from {

                height: 12px;
            }

            to {

                height: 28px;
            }
        }


        /* =========================
           CHAT
        ========================= */

        .chat-area {

            display: flex;

            flex-direction: column;

            padding: 30px;
        }


        .chat-title {

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 5px;
        }


        .chat-subtitle {

            color: #aeb8e8;

            font-size: 14px;

            margin-bottom: 20px;
        }


        .chat {

            flex: 1;

            overflow-y: auto;

            padding: 10px;

            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .msg {

            max-width: 85%;

            padding:
                13px 17px;

            border-radius: 16px;

            line-height: 1.5;

            white-space: pre-wrap;

            font-size: 15px;
        }


        .msg.user {

            align-self: flex-end;

            background:
                linear-gradient(
                    135deg,
                    #365be9,
                    #2441b5
                );

            border-bottom-right-radius:
                5px;
        }


        .msg.mentor {

            align-self: flex-start;

            background:
                #20295b;

            border-bottom-left-radius:
                5px;
        }


        .input-area {

            display: flex;

            gap: 10px;

            margin-top: 15px;
        }


        #input {

            flex: 1;

            min-width: 0;

            padding: 15px;

            border-radius: 14px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.15
                );

            outline: none;

            background: #11183a;

            color: white;

            font-size: 15px;
        }


        #input::placeholder {

            color: #8993c4;
        }


        button {

            border: none;

            border-radius: 13px;

            padding:
                0 20px;

            cursor: pointer;

            font-weight: bold;

            background: #71e8dd;

            color: #08121e;
        }


        button:disabled {

            opacity: 0.5;

            cursor: not-allowed;
        }


        #mic {

            width: 55px;

            padding: 0;

            font-size: 20px;
        }


        .note {

            text-align: center;

            color: #737da9;

            font-size: 12px;

            margin-top: 10px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .mentor-box {

                grid-template-columns:
                    1fr;
            }


            .avatar-area {

                min-height: 430px;
            }


            .chat-area {

                min-height: 550px;
            }

        }

    </style>

</head>


<body>


<div class="main">


    <div class="mentor-box">


        <!-- =========================
             AVATAR
        ========================== -->

        <section class="avatar-area">


            <div class="avatar-title">

                मेरा AI Study Mentor

            </div>


            <div
                id="character"
                class="character normal"
            >

                <div class="hair"></div>


                <div class="head">

                    <div class="brow left"></div>

                    <div class="brow right"></div>


                    <div class="eye left"></div>

                    <div class="eye right"></div>


                    <div class="nose"></div>

                    <div class="mouth"></div>

                </div>


                <div class="neck"></div>

                <div class="body"></div>

            </div>


            <div
                id="status"
                class="status"
            >

                👋 मैं आपकी मदद के लिए तैयार हूँ।

            </div>


        </section>


        <!-- =========================
             CHAT
        ========================== -->

        <section class="chat-area">


            <div class="chat-title">

                AI Mentor

            </div>


            <div class="chat-subtitle">

                आप मुझसे किसी भी विषय के बारे में पूछ सकते हैं।

            </div>


            <div
                id="chat"
                class="chat"
            >

                <div class="msg mentor">

                    नमस्ते! मैं आपका AI Mentor हूँ।
                    आप UPSC, UPPCS, History, Geography,
                    Polity या किसी भी विषय के बारे में
                    सवाल पूछ सकते हैं।

                </div>

            </div>


            <div class="input-area">


                <input
                    id="input"
                    type="text"
                    placeholder="अपना सवाल लिखें..."
                    autocomplete="off"
                >


                <button
                    id="send"
                    type="button"
                >

                    Send

                </button>


                <button
                    id="mic"
                    type="button"
                    title="Voice Question"
                >

                    🎤

                </button>


            </div>


            <div class="note">

                आपका सवाल सुरक्षित रूप से AI Mentor server को भेजा जाएगा।

            </div>


        </section>


    </div>


</div>


<!-- ==========================================
     ONLY ONE JAVASCRIPT FILE
     ========================================== -->

<script src="app.js"></script>


</body>

</html>
